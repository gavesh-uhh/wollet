<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Wollet</title>
  <style>
    @font-face { font-family: "Sora"; font-style: normal; font-weight: 100 800; font-display: swap; src: url("/fonts/sora-latin-variable.woff2") format("woff2"); }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #000;
      color: #f5f5f7;
      font-family: "Sora", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .offline-box {
      max-width: 420px;
      width: 100%;
      background: #1c1c1e;
      border-radius: 24px;
      padding: 32px 24px;
    }
    h1 { font-size: 28px; margin-bottom: 12px; }
    p { font-size: 17px; color: #98989f; line-height: 1.5; margin-bottom: 24px; }
    button {
      background: #0a84ff;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="offline-box">
    <h1>Wollet Digital Wallet</h1>
    <p>Connect to the internet to finish loading your wallet. Saved items will be available offline after setup.</p>
    <button onclick="window.location.reload()">Reload Wallet</button>
  </div>
</body>
</html>
